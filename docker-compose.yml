# Pexlo Portal — reference compose.
#
# This mirrors the production deployment on the Hetzner box
# (/opt/pexlo-portal/docker-compose.yml), which is the source of truth and is
# driven by /opt/pexlo-portal/deploy.sh (build-on-box -> compose up -> health
# check -> rollback). The image `pexlo-portal:latest` is built on the box from
# docker/unified.Dockerfile; it is not pulled from a registry.
#
# Auth is WorkOS (AuthKit). Storage is Cloudflare R2. TLS terminates at Caddy.
# The database is external (Neon) via DATABASE_URL — there is no bundled
# Postgres in production. A self-host Postgres option is provided (commented)
# at the bottom for fully self-contained setups.

services:
  atrium: # compose service name kept as `atrium` to match the box (deploy.sh SERVICE=atrium)
    image: pexlo-portal:latest
    container_name: pexlo-portal
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DIRECT_URL: "${DIRECT_URL}"
      WEB_URL: "${WEB_URL:-https://portal.pexlo.com}"
      API_URL: "${API_URL:-https://portal.pexlo.com}"
      NODE_ENV: "production"
      SECURE_COOKIES: "true"
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      MAX_FILE_SIZE_MB: "${MAX_FILE_SIZE_MB:-100}"
      SKIP_DB_PUSH: "${SKIP_DB_PUSH:-false}"
      # Storage — Cloudflare R2 (S3-compatible)
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-r2}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "auto"
      S3_BUCKET: "${S3_BUCKET:-pexlo-portal}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      # Email
      RESEND_API_KEY: "${RESEND_API_KEY}"
      EMAIL_FROM: "${EMAIL_FROM:-portal@pexlo.com}"
      # Auth — WorkOS (AuthKit)
      WORKOS_API_KEY: "${WORKOS_API_KEY}"
      WORKOS_CLIENT_ID: "${WORKOS_CLIENT_ID}"
      WORKOS_COOKIE_PASSWORD: "${WORKOS_COOKIE_PASSWORD}"
      WORKOS_REDIRECT_URI: "${WORKOS_REDIRECT_URI}"
      WORKOS_COOKIE_NAME: "${WORKOS_COOKIE_NAME:-wos-session}"
    networks:
      - portal

  caddy:
    image: caddy:2-alpine
    container_name: pexlo-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - atrium
    networks:
      - portal

networks:
  portal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:

